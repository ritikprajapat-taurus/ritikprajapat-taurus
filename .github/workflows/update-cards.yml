name: update-readme-cards

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch: # lets you trigger it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/update-cards.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0D1117&title_color=39FF14&icon_color=FF2E88&text_color=E6E6E6
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate top-languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=E6E6E6&layout=compact
          path: profile/langs.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=0D1117&stroke=0D1117&ring=39FF14&fire=FF2E88&currStreakLabel=39FF14&sideLabels=E6E6E6&currStreakNum=E6E6E6&sideNums=E6E6E6&dates=6B6B6B
          path: profile/streak.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update readme cards" || exit 0
          git push
